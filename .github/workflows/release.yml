name: Package release downloads

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-assets-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check release version
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const {version} = JSON.parse(readFileSync('extension/manifest.json', 'utf8'));
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (pkg.version !== version || ![version, `v${version}`].includes(process.env.RELEASE_TAG)) {
            throw new Error('Release tag must match package.json and extension/manifest.json versions (for example, v1.2.0).');
          }
          NODE
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke:chrome
      - name: Attach browser ZIPs and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" dist/anime-trail-*.zip dist/anime-trail-*.zip.sha256 --repo "$GITHUB_REPOSITORY" --clobber
